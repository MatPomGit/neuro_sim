model: {}
integrator:
  method: euler
timestep: 0.005
seed: 21
rng_seed: 21
task:
  name: roving_oddball
  scenario: roving_oddball
  duration: 30.0
  n_runs: 6
  run_length_min: 3
  run_length_max: 6
  deviant_probability: 1.0
  inter_stimulus_interval: 0.8
  jitter: 0.05
stimulus:
  scenario: roving_oddball
  source: task
brain_profile:
  id: default
  description: Bazowy profil parametrów modelu.
clinical_profile:
  id: gaba_dysregulation
  display_name: Dysregulacja GABA
  mechanism: Obniżona inhibicja zwiększająca szum i niestabilność kontroli przedczołowej.
  affected_regions:
  - PFC
  - ATT
  cognitive_functions:
  - hamowanie reakcji
  - stabilność uwagi
  expected_direction: stable_reference
  primary_metric: mean_abs_difference
  severity_level:
    small: 0.0
    medium: 0.02
    large: 0.05
  expected_effects:
    noise: wyższy poziom szumu aktywacji
  tolerance:
    absolute: 0.005
    relative: 0.0
    unit: mean_abs_difference
  applicability_scope: Porównania edukacyjne wpływu podniesionego noise na stabilność
    uwagi i hamowanie reakcji przy stałym seedzie oraz identycznym zadaniu.
  benchmark_source: Literature-inspired mechanistic hypothesis; brak źródła ilościowego,
    ponieważ profil jest syntetyczną manipulacją poziomu szumu, a nie estymacją z
    danych GABA.
  amplitude_latency_mechanism:
    expected_amplitude_direction: higher_noise_or_unstable_amplitude
    expected_readaptation_direction: longer_readaptation
    qualitative_threshold: 0.05
    mechanism_comment: Obniżona inhibicja może zwiększać niestabilność amplitudy proxy
      i wydłużać ponowne dopasowanie po dewiancie.
    educational_comment: Porównanie z profilem zdrowym pokazuje, czy symulacja wspiera
      dydaktyczną hipotezę o mniej stabilnej kontroli hamowania.
connectome:
  atlas: default_regions
  weights: data/connectomes/weights.csv
  fiber_lengths: data/connectomes/fiber_lengths.csv
pathology:
  enabled: true
  scenario: reduced_gaba
  mutations: []
snn:
  enabled: false
  circuits: []
analysis:
  sets:
  - spectral
  - phase_locking
  - connectivity
  - information_flow
output:
  save_results: false
  label: roving_oddball_disorder_gaba
  output_dir: outputs
