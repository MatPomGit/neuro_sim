id: go_nogo_inhibition
label_pl: Lekcja — hamowanie reakcji w Go/NoGo
level_pl: podstawowy
estimated_duration_min: 45
scenario_config: configs/go_nogo.yaml
comparison_config: configs/comparisons/go_nogo_profiles.yaml
learning_goal_pl: Uczestnik łączy warunki go/nogo z kontrolą wykonawczą, błędami hamowania i interpretacją profili GABA/DLPFC.
pre_run_questions_pl:
  - Kiedy model powinien wygenerować odpowiedź press?
  - Dlaczego osłabienie kontroli wykonawczej może zwiększać błędy w warunku nogo?
expected_observations_pl:
  - Tabela triali rozdziela bodźce go i nogo oraz pokazuje wynik odpowiedzi.
  - Porównanie profili pokazuje jakościowy kierunek różnic względem healthy_v1.
post_run_questions_pl:
  - Które triale wskazują błąd hamowania?
  - Jak zmienia się interpretacja po porównaniu z profilem DLPFC weakening?
next_run_changes:
  - element: Profil kliniczny
    current_value: healthy_v1
    next_value: dlpfc_weakening
    reason: Pokazanie wpływu kontroli wykonawczej na hamowanie odpowiedzi.
