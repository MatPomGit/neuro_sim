id: n_back_working_memory
label_pl: Lekcja — pamięć robocza w n-back
level_pl: średni
estimated_duration_min: 60
scenario_config: configs/n_back.yaml
comparison_config: configs/comparisons/n_back_profiles.yaml
profile_pl: Profil referencyjny healthy_v1 porównywany z deficytem dopaminowym i uszkodzeniem hipokampa.
task_pl: N-back — utrzymanie i aktualizacja pamięci roboczej.
learning_goal_pl: Uczestnik interpretuje trafienia target/non-target oraz wpływ profilu dopaminowego i hipokampalnego na metryki zadania.
lesson_steps_pl:
  - Zapisz hipotezę przed uruchomieniem na podstawie celu i pytań wstępnych.
  - Zweryfikuj plik konfiguracji, profil, task i ziarno losowości.
  - Uruchom symulację i sprawdź status zakończenia.
  - Przejrzyj oś czasu, metryki, wykresy i oczekiwane artefakty raportu.
  - Odpowiedz na pytania kontrolne i sprawdź odpowiedź według kryteriów oceny.
  - Omów ograniczenia interpretacyjne i zaplanuj kontrolowaną zmianę kolejnego przebiegu.
pre_run_questions_pl:
  - Jakie regiony i funkcje powinny być aktywne przy utrzymaniu informacji w pamięci roboczej?
  - Jak deficyt dopaminowy może zmienić stabilność odpowiedzi modelu?
expected_observations_pl:
  - Raport pokazuje warunki target/non-target, odpowiedzi i metryki behawioralne.
  - Porównanie profili wykorzystuje ten sam seed oraz tę samą sekwencję bodźców.
expected_report_pl:
  - Raport trial-by-trial z warunkiem target/non-target, odpowiedzią i poprawnością.
  - Raport porównawczy profili uruchomionych z tym samym seedem.
post_run_questions_pl:
  - Czy targety są widoczne w osi czasu i metrykach triali?
  - Który profil daje największą różnicę względem healthy_v1?
assessment_criteria_pl:
  - Odpowiedź wskazuje target i wyjaśnia jego związek z regułą n-back na podstawie osi czasu.
  - Wniosek o profilu odwołuje się do metryki raportu i nie ma charakteru diagnostycznego.
next_run_changes:
  - element: Profil kliniczny
    current_value: healthy_v1
    next_value: dopamine_deficit
    reason: Pokazanie wpływu dopaminy na utrzymanie i aktualizację reprezentacji.
