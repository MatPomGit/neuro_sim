id: stress_recovery_emotion_regulation
label_pl: Lekcja — regulacja emocji po epizodzie stresu
level_pl: średni
estimated_duration_min: 60
scenario_config: configs/scenario_yaml_stress_recovery_serotonin.yaml
comparison_config: null
learning_goal_pl: Uczestnik wyjaśnia kolejne fazy odpowiedzi stresowej i regeneracji oraz ostrożnie interpretuje wpływ zaburzenia równowagi serotoninowej na próg decyzji i elastyczność poznawczą.
pre_run_questions_pl:
  - Które fazy scenariusza powinny odpowiadać narastaniu stresu, utrzymaniu pobudzenia i regeneracji?
  - Jak podwyższony próg decyzji może zmienić zachowanie modelu podczas wygaszania pobudzenia?
expected_observations_pl:
  - Oś czasu rozdziela fazę stresu od regeneracji i pozwala powiązać je ze zmianami aktywności SAL, EXEC oraz DMN.
  - Raport pokazuje jakościowe zmiany pewności i błędu predykcji bez przypisywania im znaczenia diagnostycznego.
post_run_questions_pl:
  - W której fazie przebiegu zmiana aktywności regionów związanych z kontrolą i salience jest najbardziej widoczna?
  - Czy powrót metryk po epizodzie stresu jest natychmiastowy, czy rozłożony w czasie?
next_run_changes:
  - element: Próg decyzji
    current_value: "0.72"
    next_value: "0.65"
    reason: Porównanie ostrożnego i łatwiejszego przełączania decyzji przy tej samej konfiguracji scenariusza.
