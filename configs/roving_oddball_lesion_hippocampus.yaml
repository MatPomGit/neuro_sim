model: {}
integrator:
  method: euler
timestep: 0.005
seed: 21
rng_seed: 21
task:
  name: roving_oddball
  scenario: roving_oddball
  duration: 30.0
  n_runs: 6
  run_length_min: 3
  run_length_max: 6
  deviant_probability: 1.0
  inter_stimulus_interval: 0.8
  jitter: 0.05
stimulus:
  scenario: roving_oddball
  source: task
brain_profile:
  id: default
  description: Bazowy profil parametrów modelu.
clinical_profile:
  id: hippocampal_lesion
  display_name: Uszkodzenie hipokampa
  mechanism: Ograniczona integracja epizodyczna i słabsze przewidywanie sensoryczne
    zależne od pamięci.
  affected_regions:
  - EPIS
  - Hippocampus
  cognitive_functions:
  - pamięć epizodyczna
  - detekcja nowości
  expected_direction: stable_reference
  primary_metric: mean_abs_difference
  severity_level:
    small: 0.0
    medium: 0.02
    large: 0.05
  expected_effects:
    pathology_scenario: hippocampal_lesion
  tolerance:
    absolute: 0.005
    relative: 0.0
    unit: mean_abs_difference
  applicability_scope: Porównania edukacyjne zmian po scenariuszu hippocampal_lesion
    w zadaniach pamięci epizodycznej, detekcji nowości i roving oddball.
  benchmark_source: Syntetyczny scenariusz lesion utrzymywany w repozytorium; brak
    benchmarku empirycznego, ponieważ nie jest dopasowany do danych pacjentów po uszkodzeniu
    hipokampa.
  amplitude_latency_mechanism:
    expected_amplitude_direction: lower_contextual_amplitude
    expected_readaptation_direction: longer_readaptation
    qualitative_threshold: 0.05
    mechanism_comment: Lezja hipokampa ogranicza kontekst epizodyczny, dlatego raport
      akcentuje słabszą integrację nowego standardu i readaptację.
    educational_comment: Różnice traktuj jako ilustrację roli pamięci epizodycznej
      w przewidywaniu sensorycznym, nie jako marker diagnostyczny.
connectome:
  atlas: default_regions
  weights: data/connectomes/weights.csv
  fiber_lengths: data/connectomes/fiber_lengths.csv
pathology:
  enabled: true
  scenario: hippocampal_lesion
  mutations: []
snn:
  enabled: false
  circuits: []
analysis:
  sets:
  - spectral
  - phase_locking
  - connectivity
  - information_flow
output:
  save_results: false
  label: roving_oddball_lesion_hippocampus
  output_dir: outputs
