model: {}
integrator:
  method: euler
timestep: 0.005
seed: 21
rng_seed: 21
task:
  name: roving_oddball
  scenario: roving_oddball
  duration: 30.0
  n_runs: 6
  run_length_min: 3
  run_length_max: 6
  deviant_probability: 1.0
  inter_stimulus_interval: 0.8
  jitter: 0.05
stimulus:
  scenario: roving_oddball
  source: task
brain_profile:
  id: default
  description: Bazowy profil parametrów modelu.
clinical_profile:
  id: hippocampal_lesion
  display_name: Uszkodzenie hipokampa
  mechanism: Ograniczona integracja epizodyczna i słabsze przewidywanie sensoryczne
    zależne od pamięci.
  affected_regions:
  - EPIS
  - Hippocampus
  cognitive_functions:
  - pamięć epizodyczna
  - detekcja nowości
  expected_effects:
    pathology_scenario: hippocampal_lesion
  expected_direction: stable_reference
  primary_metric: mean_abs_difference
  severity_level:
    small: 0.0
    medium: 0.02
    large: 0.05
connectome:
  atlas: default_regions
  weights: data/connectomes/weights.csv
  fiber_lengths: data/connectomes/fiber_lengths.csv
pathology:
  enabled: true
  scenario: hippocampal_lesion
  mutations: []
snn:
  enabled: false
  circuits: []
analysis:
  sets:
  - spectral
  - phase_locking
  - connectivity
  - information_flow
output:
  save_results: false
  label: roving_oddball_lesion_hippocampus
  output_dir: outputs
