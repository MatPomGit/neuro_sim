name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff mypy tomli

      - name: Ruff correctness gate
        run: >-
          python -m ruff check --select F
          main.py
          brain_core/simulation/behavior_readout.py
          brain_core/simulation/task_drive.py
          tests/test_public_entrypoints.py
          tests/test_main_cli.py
          tests/test_behavior_readout.py
          tests/test_task_drive.py

      - name: Mypy critical modules
        if: matrix.python-version == '3.12'
        run: >-
          python -m mypy --follow-imports=silent
          brain_model/oscillators.py
          brain_model/calibration.py
          brain_model/validation.py
          brain_model/plotting.py

      - name: Diagnostic entry-point and adapter tests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: >-
          python -m pytest
          tests/test_main_cli.py
          tests/test_public_entrypoints.py
          tests/test_behavior_readout.py
          tests/test_task_drive.py

      - name: Diagnostic task engine tests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m pytest tests/test_task_protocols_and_engine.py

      - name: Diagnostic config tests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m pytest tests/test_config_schema.py

      - name: Diagnostic analysis tests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m pytest tests/test_observation_and_analysis.py

      - name: Diagnostic static-policy tests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: >-
          python -m pytest
          tests/test_adr_registry_static.py
          tests/test_cli_no_print_static.py
          tests/test_docstring_quality.py
          tests/test_gui_dependencies_static.py
          tests/test_quality_policy_static.py
          tests/test_validation_metric_registry_static.py

      - name: Diagnostic model and numerical tests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: >-
          python -m pytest
          tests/test_atlas_connectome.py
          tests/test_bids_validation.py
          tests/test_calibration.py
          tests/test_experiment_result.py
          tests/test_lesions.py
          tests/test_multiscale_engine.py
          tests/test_neuromodulation.py
          tests/test_oscillator_rng_contract.py
          tests/test_oscillators.py
          tests/test_plasticity_protocols.py
          tests/test_scenarios.py
          tests/test_signal_metrics_modules.py
          tests/test_spiking_population_adapter.py
          tests/test_task_stimulus_player.py
          tests/test_timebase.py
          tests/test_wilson_cowan_network.py

      - name: Diagnostic GUI and artifact tests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: >-
          python -m pytest
          tests/test_github_windows_exe_workflow.py
          tests/test_gui_config_legacy.py
          tests/test_gui_layout_static.py
          tests/test_gui_state.py
          tests/test_lesson_configs_static.py
          tests/test_plotting_activity_xlim.py
          tests/test_plotting_svg_and_interpretation.py
          tests/test_qt_config.py
          tests/test_qt_plot_presets.py
          tests/test_qt_plotting_static.py
          tests/test_qt_profile_comparison_static.py
          tests/test_qt_runner_static.py
          tests/test_qt_sections.py
          tests/test_qt_yaml_scenarios_static.py
          tests/test_report_export_pdf.py
          tests/test_reproducibility_artifacts.py
          tests/test_sync_web_defaults.py
          tests/test_sync_web_defaults_static.py

      - name: Unit and integration tests
        run: python -m pytest

      - name: Validate default configuration
        run: python -m brain_core.simulation.run --config configs/default.yaml --dry-run

      - name: Headless engine smoke test
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          from brain_core.simulation.config_loader import load_config
          from brain_core.simulation.engine import run_experiment

          cfg = load_config("configs/default.yaml")
          cfg.task["duration"] = 0.1
          cfg.output["save_results"] = False
          result = run_experiment(cfg)
          assert len(result["time"]) > 0
          assert "analysis_report" in result
          PY
