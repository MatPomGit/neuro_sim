name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff mypy black tomli

      - name: Ruff new and public modules
        run: >-
          python -m ruff check
          main.py
          brain_core/simulation/behavior_readout.py
          brain_core/simulation/task_drive.py
          tests/test_public_entrypoints.py
          tests/test_behavior_readout.py
          tests/test_task_drive.py

      - name: Black new and public modules
        run: >-
          python -m black --check
          main.py
          brain_core/simulation/behavior_readout.py
          brain_core/simulation/task_drive.py
          tests/test_public_entrypoints.py
          tests/test_behavior_readout.py
          tests/test_task_drive.py

      - name: Mypy critical modules
        run: >-
          python -m mypy --follow-imports=silent
          brain_model/oscillators.py
          brain_model/calibration.py
          brain_model/validation.py
          brain_model/plotting.py

      - name: Unit and integration tests
        run: python -m pytest

      - name: Validate default configuration
        run: python -m brain_core.simulation.run --config configs/default.yaml --dry-run

      - name: Headless engine smoke test
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          from brain_core.simulation.config_loader import load_config
          from brain_core.simulation.engine import run_experiment

          cfg = load_config("configs/default.yaml")
          cfg.task["duration"] = 0.1
          cfg.output["save_results"] = False
          result = run_experiment(cfg)
          assert len(result["time"]) > 0
          assert "analysis_report" in result
          PY
